workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

default:
  tags: [img-build]
  interruptible: true

build:
  stage: build
  image:
    name: node:26.12.0-alpine
    entrypoint: [""]
  timeout: 10m
  script:
    - npm ci
    - npm run build
