check:
  stage: test
  image:
    name: node:22-bullseye
    entrypoint: [""]
  tags:
    - docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PROJECT_PATH == "example-group/sdd-guide-credit-calculator-stage-4-code"'
  timeout: 10m
  script:
    - npm ci
    - npm run check:code
